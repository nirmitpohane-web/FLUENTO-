<style>

.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 0 13px}.section-head h2{margin:0;font-size:1.35rem}.muted{color:var(--muted);font-size:.92rem}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow)}.course-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.course-row select,.mood-select{background:white;border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);font-weight:750}.progress-track{height:9px;background:#e5efec;border-radius:99px;overflow:hidden;margin-top:9px}.progress-fill{height:100%;background:var(--teal);border-radius:99px;transition:width .25s}.stage-list{display:grid;gap:13px;max-height:600px;overflow-y:auto;padding-right:5px}.stage{display:grid;grid-template-columns:56px 1fr auto;gap:13px;align-items:center;background:white;border:1px solid var(--line);border-radius:19px;padding:14px;box-shadow:var(--shadow)}.stage.locked{opacity:.68;background:#f0f5f3}.stage-icon{width:54px;height:54px;border-radius:17px;background:var(--teal2);display:grid;place-items:center;font-size:27px}.stage.locked .stage-icon{background:#e7ecea}.stage h3{margin:0 0 3px;font-size:1.04rem}.stage p{margin:0;color:var(--muted);font-size:.88rem}.stage-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.mini{font-size:.77rem;font-weight:800;background:#f1f7f5;padding:4px 7px;border-radius:7px}.primary,.secondary,.danger{padding:11px 15px;border-radius:12px;font-weight:900;transition:transform .1s}.primary{background:var(--teal);color:white}.primary:active,.secondary:active{transform:scale(.98)}.primary:disabled{background:#a6bcb7;cursor:not-allowed;opacity:.85}.secondary{background:var(--teal2);color:var(--teal)}.danger{background:#ffeaeb;color:#a62e36}.tabs{position:fixed;z-index:6;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px max(8px,env(safe-area-inset-bottom))}.tabs button{flex:1;max-width:170px;padding:9px 4px;border-radius:12px;background:transparent;color:var(--muted);font-size:.78rem;font-weight:850}.tabs button.active{background:var(--teal2);color:var(--teal)}.tabs span{display:block;font-size:1.2rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.friend{display:flex;align-items:center;gap:12px}.avatar{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:#fce8d2;font-size:25px}.friend-info{flex:1;min-width:0}.friend-info strong{display:block}.friend-info small{color:var(--muted)}.rank{font-weight:950;color:var(--teal)}.quiz-shell{max-width:700px;margin:0 auto}.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.quiz-progress{flex:1}.close-btn{background:#edf4f1;border-radius:50%;width:40px;height:40px;font-size:20px}.question-card{background:white;border:1px solid var(--line);border-radius:23px;padding:22px;box-shadow:var(--shadow)}.question-card h2{font-size:clamp(1.3rem,4vw,1.9rem);margin:8px 0 18px}.question-type{font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:var(--teal);font-weight:950}.options{display:grid;gap:10px}.option{border:2px solid var(--line);border-radius:14px;padding:13px;text-align:left;background:white;font-weight:750;color:var(--ink);width:100%;touch-action:manipulation}.option:disabled{opacity:1;cursor:default}.option.selected{border-color:var(--teal);background:var(--teal2)}.option.correct{border-color:#3a9c68;background:#e3f8e9}.option.wrong{border-color:var(--red);background:#ffebec}.feedback{padding:12px;border-radius:12px;margin-top:14px;font-weight:800}.feedback.good{background:#e3f8e9;color:#17633b}.feedback.bad{background:#ffebec;color:#a62e36}.quiz-actions{display:flex;justify-content:flex-end;margin-top:18px}.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.metric{padding:15px;border:1px solid var(--line);border-radius:16px;background:white}.metric strong{display:block;font-size:1.5rem}.metric span{font-size:.86rem;color:var(--muted)}.empty{text-align:center;padding:28px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:25px}.welcome{position:fixed;inset:0;z-index:20;min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px 18px;background:radial-gradient(circle at 80% 20%,#d7f36a88,transparent 28%),linear-gradient(135deg,#e7faf4,#f7fbff)}.welcome h1{font-size:clamp(42px,10vw,72px);letter-spacing:-2px;margin:8px 0;color:#147d78;font-weight:950}.welcome-inner{max-width:560px;width:100%}.welcome .owl{font-size:76px}.director{font-size:12px;font-weight:900;letter-spacing:.5px}.mood-panel{margin-top:16px}.mood-row{display:flex;align-items:center;gap:14px}.mood-face{font-size:55px;min-width:65px;text-align:center}.mood-select{display:block;width:100%;margin-top:8px}.sound-button{width:100%;margin-top:10px}.mood-face.pop{animation:pop .35s ease}@keyframes pop{50%{transform:scale(1.25) rotate(-5deg)}}
@media(max-width:560px){header{padding:10px 12px}.brand{font-size:1.1rem}.brandmark{width:34px;height:34px}.stats{gap:5px}.pill{padding:6px 7px;font-size:.78rem}.hero{padding:19px}.mascot{font-size:57px}.stage{grid-template-columns:46px 1fr;gap:10px}.stage-icon{width:46px;height:46px}.stage>button{grid-column:2;justify-self:start}.stage p{font-size:.83rem}.section-head{align-items:start;flex-direction:column}.question-card{padding:17px}}

@keyframes discoveryBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.goamap{position:relative;min-height:330px;border-radius:22px;overflow:hidden;border:1px solid #b8dfd7;background:linear-gradient(180deg,#8ce0f2 0 45%,#0099cc 45% 100%);margin:12px 0}
.goamap:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(170deg,transparent 0 28px,#ffffff35 29px 31px,transparent 32px 55px);pointer-events:none}
.map-land{position:absolute;left:-5%;right:-8%;bottom:-35px;height:40%;background:#e0c38c;border-radius:48% 48% 0 0;transform:rotate(-3deg);border-top:8px solid #f7e2b2}

.map-pin{position:absolute;z-index:2;transform:translate(-50%,-50%);border:2px solid white;border-radius:17px;background:#fff;color:#17353c;padding:7px 8px;box-shadow:0 5px 14px #163d3a35;font-size:1.05rem;min-width:48px}

<body>
<header><div class="brand"><div class="brandmark">F</div>Fluento</div><div class="stats"><div class="pill">🔥 <b id="streak">1</b></div><div class="pill">⚡ <b id="xp">0</b> XP</div><div class="pill">❤️ <b id="hearts">5</b></div></div></header>
<main id="app"></main>
<div id="welcomeScreen" class="welcome" style="display:none"><div class="welcome-inner"><div class="director">DIRECTOR: NIRMIT</div><div class="owl" id="welcomeFace">🦉</div><h1>FLUENTO</h1><h2>Learn a little. Grow every day.</h2><p id="welcomeMessage">1,000 stages per language, 30 questions per lesson & rewards!</p><button class="primary" onclick="enterFluento()">Start learning →</button></div></div>
<nav class="tabs" aria-label="Main navigation"><button data-tab="learn" class="active"><span>🗺️</span>Learn</button><button data-tab="friends"><span>👥</span>Friends</button><button data-tab="quests"><span>🎯</span>Quests</button><button data-tab="profile"><span>🏆</span>Profile</button></nav>

<script>
const vocabulary={
Spanish:[["Hola","Hello"],["Gracias","Thank you"],["Adiós","Goodbye"],["Por favor","Please"],["Agua","Water"],["Pan","Bread"],["Casa","House"],["Libro","Book"],["Amigo","Friend"],["Familia","Family"],["Perro","Dog"],["Gato","Cat"],["Manzana","Apple"],["Leche","Milk"],["Buenos días","Good morning"],["Buenas noches","Good night"],["¿Cómo estás?","How are you?"],["Me llamo…","My name is…"],["Sí","Yes"],["No","No"],["Escuela","School"],["Comida","Food"],["Rojo","Red"],["Uno","One"],["Hasta luego","See you later"],["Sol","Sun"],["Luna","Moon"],["Mar","Sea"],["Flor","Flower"],["Tiempo","Time"],["Trabajo","Work"],["Ciudad","City"],["País","Country"],["Música","Music"],["Feliz","Happy"]],
English:[["Hello","Greeting"],["Thank you","Gratitude"],["Goodbye","Parting greeting"],["Please","Polite request"],["Water","A drink"],["Bread","Food item"],["House","Place to live"],["Book","Something to read"],["Friend","A person you trust"],["Family","Household members"],["Dog","A common pet"],["Cat","A feline pet"],["Apple","A fruit"],["Milk","A dairy drink"],["Good morning","Early greeting"],["Good night","Sleep greeting"],["How are you?","Checking in"],["My name is…","Introduction"],["Yes","Affirmative"],["No","Negative"],["School","Learning place"],["Food","Nourishment"],["Red","A color"],["One","Number 1"],["See you later","Farewell"],["Sun","Day star"],["Moon","Night satellite"],["Ocean","Sea"],["Flower","Plant"],["Time","Duration"],["Work","Job"],["City","Urban area"],["Country","Nation"],["Music","Songs"],["Happy","Joyful"]],
Hindi:[["नमस्ते","Hello"],["धन्यवाद","Thank you"],["अलविदा","Goodbye"],["कृपया","Please"],["पानी","Water"],["रोटी","Bread"],["घर","House"],["किताब","Book"],["मित्र","Friend"],["परिवार","Family"],["कुत्ता","Dog"],["बिल्ली","Cat"],["सेब","Apple"],["दूध","Milk"],["सुप्रभात","Good morning"],["शुभ रात्रि","Good night"],["आप कैसे हैं?","How are you?"],["मेरा नाम… है","My name is…"],["हाँ","Yes"],["नहीं","No"],["विद्यालय","School"],["भोजन","Food"],["लाल","Red"],["एक","One"],["फिर मिलेंगे","See you again"],["सूरज","Sun"],["चाँद","Moon"],["समुद्र","Sea"],["फूल","Flower"],["समय","Time"],["काम","Work"],["शहर","City"],["देश","Country"],["संगीत","Music"],["खुश","Happy"]],
French:[["Bonjour","Hello"],["Merci","Thank you"],["Au revoir","Goodbye"],["S’il vous plaît","Please"],["Eau","Water"],["Pain","Bread"],["Maison","House"],["Livre","Book"],["Ami","Friend"],["Famille","Family"],["Chien","Dog"],["Chat","Cat"],["Pomme","Apple"],["Lait","Milk"],["Bonne nuit","Good night"],["Comment ça va ?","How are you?"],["Je m’appelle…","My name is…"],["Oui","Yes"],["Non","No"],["École","School"],["Nourriture","Food"],["Rouge","Red"],["Soleil","Sun"],["Lune","Moon"],["Mer","Sea"]],
German:[["Hallo","Hello"],["Danke","Thank you"],["Tschüss","Goodbye"],["Bitte","Please"],["Wasser","Water"],["Brot","Bread"],["Haus","House"],["Buch","Book"],["Freund","Friend"],["Familie","Family"],["Hund","Dog"],["Katze","Cat"],["Apfel","Apple"],["Milch","Milk"],["Gute Nacht","Good night"],["Wie geht es dir?","How are you?"],["Ich heiße…","My name is…"],["Ja","Yes"],["Nein","No"],["Schule","School"],["Essen","Food"],["Rot","Red"],["Sonne","Sun"],["Mond","Moon"],["Meer","Sea"]],
Italian:[["Ciao","Hello"],["Grazie","Thank you"],["Arrivederci","Goodbye"],["Per favore","Please"],["Acqua","Water"],["Pane","Bread"],["Casa","House"],["Libro","Book"],["Amico","Friend"],["Famiglia","Family"],["Cane","Dog"],["Gatto","Cat"],["Mela","Apple"],["Latte","Milk"],["Buonanotte","Good night"],["Come stai?","How are you?"],["Mi chiamo…","My name is…"],["Sì","Yes"],["No","No"],["Scuola","School"],["Cibo","Food"],["Rosso","Red"],["Sole","Sun"],["Luna","Moon"],["Mare","Sea"]],
Japanese:[["こんにちは","Hello"],["ありがとう","Thank you"],["さようなら","Goodbye"],["お願いします","Please"],["水","Water"],["パン","Bread"],["家","House"],["本","Book"],["友達","Friend"],["家族","Family"],["犬","Dog"],["猫","Cat"],["りんご","Apple"],["牛乳","Milk"],["おやすみなさい","Good night"],["元気ですか？","How are you?"],["はい","Yes"],["いいえ","No"],["学校","School"],["食べ物","Food"],["太陽","Sun"],["月","Moon"],["海","Sea"]],
Korean:[["안녕하세요","Hello"],["감사합니다","Thank you"],["안녕히 가세요","Goodbye"],["주세요","Please"],["물","Water"],["빵","Bread"],["집","House"],["책","Book"],["친구","Friend"],["가족","Family"],["개","Dog"],["고양이","Cat"],["사과","Apple"],["우유","Milk"],["좋은 아침","Good morning"],["네","Yes"],["아니요","No"],["학교","School"],["음식","Food"],["해","Sun"],["달","Moon"],["바다","Sea"]]
};

// Generate 1,000 stages programmatically for every language
const stageIcons = ["👋","🧑‍🤝‍🧑","🥑","🌱","🧱","🚩","⭐","🏆","🔥","🚀","💎","🎯"];
const courses = {};
for (const [lang, vocab] of Object.entries(vocabulary)) {
  const stages = [];
  for (let i = 1; i <= 1000; i++) {
    stages.push({
      id: i,
      title: `Stage ${i} Mastery`,
      desc: `Practice level ${i} vocabulary and build fluency`,
      icon: stageIcons[i % stageIcons.length]
    });
  }
  courses[lang] = { flag: "🌍", label: lang, stages: stages };
}
courses.Spanish.flag = "🇪🇸"; courses.English.flag = "🇬🇧"; courses.Hindi.flag = "🇮🇳";
courses.French.flag = "🇫🇷"; courses.German.flag = "🇩🇪"; courses.Italian.flag = "🇮🇹";
courses.Japanese.flag = "🇯🇵"; courses.Korean.flag = "🇰🇷";

const initial={course:"Spanish",xp:0,hearts:5,streak:1,done:{},earned:[],tab:"learn",name:"Learner",friends:[{name:"Aarav",emoji:"🦊",xp:120},{name:"Mira",emoji:"🐼",xp:95},{name:"Kabir",emoji:"🐯",xp:80}],discoveries:[],questsClaimed:[],userId:"",welcomeSeen:false,lastVisitAt:0,soundOn:true,moodOverride:"auto",autoMood:"happy",moodUntil:0};
let state;try{state={...initial,...JSON.parse(localStorage.getItem("fluento-save")||"{}")}}catch{state={...initial}}
let current=null,qi=0,score=0,selected=null,quizQuestions=[],quizMode="stage";

const moods={happy:{face:"😊",message:"You're doing great! Keep learning!"},sad:{face:"🥺",message:"That's okay! Every mistake helps you learn."},excited:{face:"🤩",message:"WOW! 30 questions completed!"},angry:{face:"😠",message:"Tricky question! Focus up!"}};

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function build30Questions(){
  const bank = vocabulary[state.course] || vocabulary.Spanish;
  const questions = [];
  for (let i = 0; i < 30; i++) {
    const item = bank[i % bank.length];
    const word = item[0];
    const meaning = item[1];
    const distractors = shuffle(bank.filter(x => x[1] !== meaning).map(x => x[1])).slice(0, 3);
    const opts = shuffle([meaning, ...distractors]);
    questions.push({
      q: `Question ${i + 1}/30: What does “${word}” mean?`,
      word: word,
      opts: opts,
      a: meaning,
      tip: `“${word}” translates to “${meaning}”.`
    });
  }
  return questions;
}

function speakWord(word){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(word);u.rate=.85;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}
function save(){try{localStorage.setItem("fluento-save",JSON.stringify(state))}catch(e){}updateStats()}
function updateStats(){document.getElementById("xp").textContent=state.xp;document.getElementById("hearts").textContent=state.hearts;document.getElementById("streak").textContent=state.streak}
function getMood(){if(state.moodOverride&&state.moodOverride!=="auto")return state.moodOverride;if(state.moodUntil>Date.now()&&moods[state.autoMood])return state.autoMood;return "happy"}
function setMood(m){state.moodOverride=m;save();render()}

function enterFluento(){state.welcomeSeen=true;if(!state.userId)state.userId="FL-"+Math.random().toString(36).slice(2,8).toUpperCase();save();render()}
function doneKey(i){return state.course+"-"+i}
function isDone(i){return !!state.done[doneKey(i)]}
function isUnlocked(i){return i===0||isDone(i-1)}

function setTab(tab){state.tab=tab;save();render()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

function render(){
  updateStats();
  const welcome=document.getElementById("welcomeScreen");
  if(welcome)welcome.style.display=state.welcomeSeen?"none":"grid";
  const app=document.getElementById("app");
  if(state.tab==="learn")app.innerHTML=learnHTML();
  else if(state.tab==="friends")app.innerHTML=friendsHTML();
  else if(state.tab==="quests")app.innerHTML=questsHTML();
  else app.innerHTML=profileHTML();
  document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab))
}

function learnHTML(){
  const c = courses[state.course] || courses.Spanish;
  const finished = Object.keys(state.done).filter(k => k.startsWith(state.course + "-")).length;
  const pct = ((finished / 1000) * 100).toFixed(1);
  return `
  <section class="hero"><div><div class="eyebrow">1,000 STAGES CHALLENGE</div><h1>Small steps.<br>Big fluency.</h1><p>30 questions per quiz across 1,000 stages with Ollie cheering you on!</p></div><div class="mascot">${moods[getMood()].face}</div></section>
  <div class="panel" style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><button class="primary" onclick="startLesson(0)">📝 Start 30-Question Test</button></div>
  <div class="section-head"><div><h2>Your 1,000 Stage Path</h2><div class="muted">${c.flag} ${c.label} · ${finished}/1000 stages completed (${pct}%)</div></div></div>
  <div class="panel"><div class="course-row"><label for="courseSelect"><b>Select Course</b></label><select id="courseSelect" onchange="state.course=this.value;save();render()">${Object.keys(courses).map(k=>`<option ${k===state.course?"selected":""}>${k}</option>`).join("")}</select></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>
  <div class="section-head"><h2>Stages List (1 to 1000)</h2></div>
  <div class="stage-list">
    ${c.stages.slice(0, Math.max(finished + 10, 20)).map((s,i)=>{
      const d=isDone(i),u=isUnlocked(i);
      return `<article class="stage ${u?"":"locked"}"><div class="stage-icon">${d?"✅":u?s.icon:"🔒"}</div><div><h3>${s.title}</h3><p>${s.desc}</p><div class="stage-meta"><span class="mini">30 Questions</span><span class="mini">⭐ 300 XP</span>${d?'<span class="mini">Completed</span>':""}</div></div><button class="${u?"primary":"secondary"}" ${u?"":"disabled"} onclick="startLesson(${i})">${d?"Practice":u?"Start":"Locked"}</button></article>`
    }).join("")}
  </div>`;
}

function friendsHTML(){
  return `<div class="section-head"><h2>Friends Circle & Sea Map 👥</h2></div><div class="panel"><div class="goamap"><div class="map-land"></div><span class="map-label" style="left:10%;top:10%">🌊 OCEAN REEF</span><div class="map-pin you" style="left:50%;top:40%">🦉<small>You</small></div></div><p class="muted">Complete 30-question stages to travel deeper into the sea!</p></div>`;
}

function questsHTML(){
  return `<div class="section-head"><h2>Daily Quests 🎯</h2></div><div class="panel"><h3>30-Question Marathon</h3><p class="muted">Finish a 30-question quiz stage to earn +50 XP!</p></div>`;
}

function profileHTML(){
  return `<div class="panel"><h2>🏆 Your Profile</h2><p><b>User ID:</b> ${state.userId}</p><p><b>Total XP:</b> ${state.xp}</p></div>`;
}

function startLesson(i){
  current=i; qi=0; score=0; selected=null;
  quizQuestions = build30Questions();
  showQuestion();
}

function showQuestion(){
  const app=document.getElementById("app");
  const q=quizQuestions[qi];
  app.innerHTML=`<div class="quiz-shell"><div class="quiz-top"><button class="close-btn" onclick="setTab('learn')">×</button><div class="quiz-progress"><div class="progress-track"><div class="progress-fill" style="width:${(qi/30)*100}%"></div></div></div><b>❤️ ${state.hearts}</b></div><div class="question-card"><div class="question-type">Stage ${current+1} · Question ${qi+1}/30</div><button class="secondary" onclick="speakWord('${q.word}')">🔊 Pronounce</button><h2>${q.q}</h2><div class="options">${q.opts.map(o=>`<button class="option" onclick="chooseAnswer(this)">${o}</button>`).join("")}</div><div id="feedback"></div><div class="quiz-actions"><button class="primary" id="checkBtn" onclick="checkAnswer()" disabled>Check answer</button></div></div></div>`;
}

function chooseAnswer(btn){
  selected=btn.textContent.trim();
  document.querySelectorAll(".option").forEach(b=>b.classList.toggle("selected",b===btn));
  document.getElementById("checkBtn").disabled=false;
}

function checkAnswer(){
  const q=quizQuestions[qi], ok=selected===q.a;
  if(ok){score++; state.xp+=10;} else {state.hearts=Math.max(0,state.hearts-1);}
  const fb=document.getElementById("feedback");
  fb.className="feedback "+(ok?"good":"bad");
  fb.textContent=(ok?"Correct! ":"Incorrect. ")+q.tip;
  document.querySelectorAll(".option").forEach(b=>{b.disabled=true; if(b.textContent===q.a)b.classList.add("correct"); else if(b.textContent===selected)b.classList.add("wrong");});
  const btn=document.getElementById("checkBtn");
  btn.textContent=qi===29?"Finish Quiz":"Next Question";
  btn.onclick=nextQuestion;
}

function nextQuestion(){
  qi++; selected=null; save();
  if(qi<30) showQuestion();
  else finishLesson();
}

function finishLesson(){
  state.done[doneKey(current)]=true;
  save();
  document.getElementById("app").innerHTML=`<div class="quiz-shell"><div class="question-card" style="text-align:center"><h1>🎉 STAGE COMPLETE!</h1><p>You answered <b>${score} of 30</b> questions correctly!</p><p>+${score*10} XP Earned</p><button class="primary" onclick="setTab('learn')">Back to 1,000 Stages Path</button></div></div>`;
}

render();
</script>
</body>
</html>
