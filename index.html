<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#103f45">
<title>FLUENTO — Learn with Ollie</title>
<style>
:root{--bg:#f1faf7;--card:#fff;--ink:#17353c;--teal:#147d78;--soft:#dff5ee;--line:#dce9e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px Arial,sans-serif}
header{background:#103f45;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
main{max-width:760px;margin:auto;padding:16px 14px 90px}
h1,h2,h3{line-height:1.25}
button,select{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px}
button{background:var(--teal);color:white;font-weight:bold}
button:disabled{opacity:.5}
.card{background:var(--card);padding:18px;margin:14px 0;border:1px solid var(--line);border-radius:20px;box-shadow:0 4px 15px #1232}
.hero{background:linear-gradient(135deg,#126c65,#163d50);color:white;padding:20px;border-radius:22px;display:flex;align-items:center;gap:14px}
.heroText{flex:1;min-width:0}
.hero p{line-height:1.5}
.mascot{font-size:76px;min-width:90px;text-align:center;display:inline-block;animation:float 2s ease-in-out infinite;transition:transform .25s}
@keyframes float{50%{transform:translateY(-7px)}}
.face{font-size:65px;display:inline-block;transition:transform .2s}
.moodMessage{font-weight:bold;margin:7px 0}
.muted{color:#647b80;font-size:.92rem}
.full{width:100%;margin-top:9px}
.secondary{background:var(--soft);color:var(--teal)}
select{background:var(--soft);color:var(--ink);width:100%;margin:8px 0}
.option{display:block;width:100%;text-align:left;margin:9px 0;background:white;color:var(--ink);border:2px solid var(--line)}
.option.selected{border-color:var(--teal);background:var(--soft)}
.option.correct{border-color:#31945b;background:#e3f8e9}
.option.wrong{border-color:#d94f57;background:#ffebec}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid var(--line);padding:7px;gap:5px;z-index:3}
nav button{flex:1;padding:11px 2px;font-size:12px}
.stats{display:flex;gap:10px;font-size:13px}
.progress{height:9px;background:#e4eeeb;border-radius:10px;overflow:hidden}
.progress div{height:100%;background:var(--teal);transition:width .3s}
@media(max-width:420px){.hero{padding:14px}.mascot{font-size:57px;min-width:60px}.face{font-size:55px}}
</style>
</head>
<body>
<header>
  <strong>🟢 FLUENTO</strong>
  <div class="stats">
    <span>⚡ <b id="xp">0</b> XP</span>
    <span>❤️ <b id="hearts">5</b></span>
  </div>
</header>

<main id="app"></main>

<nav>
  <button onclick="showHome()">🏠 Home</button>
  <button onclick="showLessons()">📚 Learn</button>
  <button onclick="showMood()">😊 Ollie</button>
  <button onclick="showProfile()">🏆 Profile</button>
</nav>

<script>
"use strict";

const STORAGE_KEY = "fluento_complete_v1";

const initialState = {
  xp: 0,
  hearts: 5,
  completed: [],
  lastVisit: 0,
  sound: true,
  override: "auto",
  autoMood: "happy",
  moodUntil: 0
};

let state;
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  state = {...initialState, ...saved};
  if (!Array.isArray(state.completed)) state.completed = [];
} catch (e) {
  state = {...initialState};
}

const moods = {
  happy: {
    face: "😊",
    name: "Happy",
    message: "You're doing great! Keep learning!",
    sound: [523, 659, 784]
  },
  sad: {
    face: "🥺",
    name: "Sad",
    message: "That's okay! Mistakes help us learn.",
    sound: [392, 330]
  },
  excited: {
    face: "🤩",
    name: "Excited",
    message: "WOW! You're making amazing progress!",
    sound: [523, 659, 784, 1047]
  },
  angry: {
    face: "😠",
    name: "Grumpy",
    message: "Grrr! That was tricky. Let's try again!",
    sound: [220, 180]
  }
};

const questions = [
  {q:"How do you say Hello in Spanish?",o:["Hola","Gracias","Agua","Adiós"],a:0,tip:"Hola means Hello."},
  {q:"What does Gracias mean?",o:["Please","Thank you","Water","Goodbye"],a:1,tip:"Gracias means Thank you."},
  {q:"Which Spanish word means water?",o:["Casa","Libro","Agua","Amigo"],a:2,tip:"Agua means Water."},
  {q:"What does Amigo mean?",o:["Friend","School","Food","Book"],a:0,tip:"Amigo means Friend."},
  {q:"How do you say Please in Spanish?",o:["Adiós","Por favor","Agua","Hola"],a:1,tip:"Por favor means Please."},
  {q:"What does Buenos días mean?",o:["Good morning","Good night","Thank you","Goodbye"],a:0,tip:"Buenos días means Good morning."},
  {q:"What does Familia mean?",o:["Family","Water","Friend","School"],a:0,tip:"Familia means Family."},
  {q:"Which word means Goodbye?",o:["Hola","Gracias","Adiós","Sí"],a:2,tip:"Adiós means Goodbye."}
];

let audioContext = null;
let questionIndex = 0;
let selectedAnswer = -1;
let questionAnswered = false;

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn("Progress could not be saved.", e);
  }
}

function getMood() {
  if (state.override !== "auto" && moods[state.override]) {
    return state.override;
  }
  if (Date.now() < state.moodUntil && moods[state.autoMood]) {
    return state.autoMood;
  }
  return "happy";
}

function playSound(kind = "happy") {
  if (!state.sound) return;

  try {
    const AudioAPI = window.AudioContext || window.webkitAudioContext;
    if (!AudioAPI) {
      showNotice("Your browser does not support audio.");
      return;
    }

    if (!audioContext || audioContext.state === "closed") {
      audioContext = new AudioAPI();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume().then(() => makeSound(kind)).catch(() => {
        showNotice("Tap Test Sound again to enable audio.");
      });
      return;
    }

    makeSound(kind);
  } catch (e) {
    showNotice("Sound could not start. Tap Test Sound again.");
  }
}

function makeSound(kind) {
  if (!audioContext || audioContext.state !== "running") return;

  const frequencies = moods[kind]?.sound || moods.happy.sound;

  frequencies.forEach((frequency, index) => {
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const start = audioContext.currentTime + index * 0.14;

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(frequency, start);

    gain.gain.setValueAtTime(0.001, start);
    gain.gain.exponentialRampToValueAtTime(0.12, start + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.24);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start(start);
    oscillator.stop(start + 0.25);
  });
}

function showNotice(message) {
  const el = document.getElementById("notice");
  if (el) el.textContent = message;
}

function testSound() {
  if (!state.sound) state.sound = true;
  save();

  try {
    const AudioAPI = window.AudioContext || window.webkitAudioContext;
    if (!AudioAPI) {
      showNotice("Audio is unavailable in this browser.");
      return;
    }

    if (!audioContext || audioContext.state === "closed") {
      audioContext = new AudioAPI();
    }

    audioContext.resume().then(() => {
      makeSound("excited");
      showNotice("🔊 Sound test played! Turn up your media volume.");
    }).catch(() => {
      showNotice("Tap Test Sound again to allow audio.");
    });
  } catch (e) {
    showNotice("Audio could not start in this browser.");
  }

  showSoundButton();
}

function showSoundButton() {
  const button = document.getElementById("soundToggle");
  if (button) button.textContent = state.sound ? "🔊 Sound ON" : "🔇 Sound OFF";
}

function toggleSound() {
  state.sound = !state.sound;
  save();
  showSoundButton();

  if (state.sound) testSound();
  else showNotice("Sound effects are turned off.");
}

function react(mood, duration = 15000, sound = true) {
  if (!moods[mood]) return;

  state.autoMood = mood;
  state.moodUntil = Date.now() + duration;
  save();
  updateOllieFace();

  if (sound) playSound(mood);
}

function updateOllieFace() {
  const mood = getMood();
  const info = moods[mood];

  document.querySelectorAll(".mascot, #ollieFace").forEach(el => {
    el.textContent = info.face;
    el.setAttribute("aria-label", "Ollie is " + info.name);
    el.style.transform = "scale(1.15)";
    setTimeout(() => {
      el.style.transform = "";
    }, 250);
  });

  document.querySelectorAll(".moodMessage").forEach(el => {
    el.textContent = info.message;
  });

  const selector = document.getElementById("moodChoice");
  if (selector && document.activeElement !== selector) {
    selector.value = state.override;
  }
}

function setMood(mood) {
  state.override = mood;
  save();
  updateOllieFace();

  if (mood !== "auto") {
    playSound(mood);
  } else {
    showNotice("Automatic mood is enabled.");
  }
}

function moodHTML() {
  const mood = getMood();
  return `
    <section class="card">
      <div style="display:flex;align-items:center;gap:15px">
        <div class="face" id="ollieFace" role="img" aria-label="Ollie">
          ${moods[mood].face}
        </div>
        <div>
          <h3 style="margin:0">Ollie says...</h3>
          <p class="moodMessage">${moods[mood].message}</p>
        </div>
      </div>

      <label for="moodChoice"><b>Test Ollie's mood</b></label>
      <select id="moodChoice" onchange="setMood(this.value)">
        <option value="auto" ${state.override==="auto"?"selected":""}>✨ Automatic</option>
        <option value="happy" ${state.override==="happy"?"selected":""}>😊 Happy</option>
        <option value="sad" ${state.override==="sad"?"selected":""}>🥺 Sad</option>
        <option value="excited" ${state.override==="excited"?"selected":""}>🤩 Excited</option>
        <option value="angry" ${state.override==="angry"?"selected":""}>😠 Angry</option>
      </select>

      <button class="secondary full" id="soundToggle" onclick="toggleSound()">
        ${state.sound?"🔊 Sound ON":"🔇 Sound OFF"}
      </button>
      <button class="full" onclick="testSound()">🔔 Test Sound</button>
      <p id="notice" class="muted" aria-live="polite"></p>
    </section>`;
}

function updateStats() {
  document.getElementById("xp").textContent = state.xp;
  document.getElementById("hearts").textContent = state.hearts;
}

function showHome() {
  const message = state.welcomeBack
    ? "You're back! Let's learn something amazing together!"
    : "A little practice every day helps you grow!";

  document.getElementById("app").innerHTML = `
    <section class="hero">
      <div class="heroText">
        <small>YOUR LEARNING COMPANION</small>
        <h1>Welcome to FLUENTO!</h1>
        <p>${message}</p>
        <button onclick="showLessons()">Start learning →</button>
      </div>
      <div class="mascot" role="img" aria-label="Ollie">${moods[getMood()].face}</div>
    </section>

    ${moodHTML()}

    <section class="card">
      <h2>📚 Your learning journey</h2>
      <p>Questions completed: ${state.completed.length} / ${questions.length}</p>
      <div class="progress">
        <div style="width:${state.completed.length/questions.length*100}%"></div>
      </div>
      <button class="full" onclick="showLessons()">Continue learning</button>
    </section>
  `;
  updateStats();
}

function showMood() {
  document.getElementById("app").innerHTML = `
    <section class="hero">
      <div class="heroText">
        <h1>Meet Ollie!</h1>
        <p>Your learning buddy reacts to your progress.</p>
      </div>
      <div class="mascot" role="img" aria-label="Ollie">${moods[getMood()].face}</div>
    </section>
    ${moodHTML()}
  `;
  updateStats();
}

function showLessons() {
  document.getElementById("app").innerHTML = `
    <h1>📚 Mini lessons</h1>
    <p class="muted">Learn Spanish words. Choose an answer and check it.</p>
    <section class="card">
      <p>Progress: ${state.completed.length}/${questions.length}</p>
      <div class="progress">
        <div style="width:${state.completed.length/questions.length*100}%"></div>
      </div>
      ${questions.map((q, i) => `
        <div style="padding:13px 0;border-bottom:1px solid var(--line)">
          <b>${i+1}. ${q.q}</b>
          <p class="muted">${state.completed.includes(i)?"✅ Completed":"Not completed yet"}</p>
          <button class="secondary full" onclick="startQuestion(${i})">
            ${state.completed.includes(i)?"Practice again":"Start question"}
          </button>
        </div>
      `).join("")}
    </section>
  `;
  updateStats();
}

function startQuestion(index) {
  questionIndex = index;
  selectedAnswer = -1;
  questionAnswered = false;

  const q = questions[index];

  document.getElementById("app").innerHTML = `
    <section class="card">
      <p class="muted">Question ${index+1} of ${questions.length}</p>
      <div class="progress">
        <div style="width:${(index+1)/questions.length*100}%"></div>
      </div>
      <h2>${q.q}</h2>
      <div id="options">
        ${q.o.map((option, i) => `
          <button class="option" onclick="chooseAnswer(${i})">${option}</button>
        `).join("")}
      </div>
      <p id="feedback" aria-live="polite"></p>
      <button id="checkButton" class="full" onclick="checkAnswer()" disabled>Check answer</button>
      <button class="secondary full" onclick="showLessons()">Back to lessons</button>
      ${moodHTML()}
    </section>
  `;
  updateStats();
}

function chooseAnswer(index) {
  if (questionAnswered) return;
  selectedAnswer = index;

  document.querySelectorAll("#options .option").forEach((button, i) => {
    button.classList.toggle("selected", i === index);
  });

  document.getElementById("checkButton").disabled = false;
}

function checkAnswer() {
  if (selectedAnswer < 0 || questionAnswered) return;

  questionAnswered = true;
  const q = questions[questionIndex];
  const correct = selectedAnswer === q.a;

  document.querySelectorAll("#options .option").forEach((button, i) => {
    button.disabled = true;
    if (i === q.a) button.classList.add("correct");
    if (i === selectedAnswer && !correct) button.classList.add("wrong");
  });

  const feedback = document.getElementById("feedback");

  if (correct) {
    feedback.textContent = "Correct! +10 XP. " + q.tip;
    state.xp += 10;

    if (!state.completed.includes(questionIndex)) {
      state.completed.push(questionIndex);
    }

    if (state.completed.length === questions.length) {
      react("excited", 60000);
      feedback.textContent += " 🎉 You completed every question!";
    } else {
      react("happy", 20000);
    }
  } else {
    feedback.textContent = "Not quite. " + q.tip;
    state.hearts = Math.max(0, state.hearts - 1);
    react("sad", 20000);
  }

  save();
  updateStats();

  const button = document.getElementById("checkButton");
  button.disabled = false;
  button.textContent = "Continue";
  button.onclick = showLessons;
}

function showProfile() {
  document.getElementById("app").innerHTML = `
    <section class="card">
      <h1>🏆 Your profile</h1>
      <h2>⚡ ${state.xp} XP</h2>
      <p>Questions completed: ${state.completed.length}/${questions.length}</p>
      <p>❤️ Hearts remaining: ${state.hearts}</p>
      <button class="full" onclick="showLessons()">Continue learning</button>
      <button class="secondary full" onclick="showMood()">Test Ollie's moods</button>
    </section>
    ${moodHTML()}
  `;
  updateStats();
}

function initialize() {
  const now = Date.now();
  const previous = Number(state.lastVisit || 0);
  const daysAway = previous ? (now - previous) / 86400000 : 0;

  state.welcomeBack = daysAway >= 3;

  
  if (state.welcomeBack) {
    state.autoMood = "excited";
    state.moodUntil = now + 60000;
  }

  state.lastVisit = now;
  save();
  showHome();

  if (state.welcomeBack) {
    // Sound will work when the user taps Test Sound.
    updateOllieFace();
  }
}

initialize();
</script>
</body>
</html>
