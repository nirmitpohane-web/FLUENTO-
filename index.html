function nextQuestion(){if(selected==="__correct__"){score++;state.xp+=10}else if(selected==="__incorrect__"){state.hearts=Math.max(0,state.hearts-1)}qi++;selected=null;save();if(qi<quizQuestions.length)showQuestion();else finishLesson()}
function finishLesson(){const key=doneKey(current),wasDone=!!state.done[key],s=getCourse().stages[current]||getCourse().stages[0];if(quizMode!=="test"&&!wasDone){state.done[key]=true;state.xp+=Math.max(0,score*2);if(!state.earned.includes("first"))state.earned.push("first");if(s.checkpoint&&!state.earned.includes("checkpoint"))state.earned.push("checkpoint")}const accuracy=Math.round(score/quizQuestions.length*100);const reward=accuracy>=90?{id:"dolphin",emoji:"🐬",name:"Dolphin Discovery",message:"Amazing accuracy! You spotted a rare ocean friend."}:accuracy>=70?{id:"fish",emoji:"🐠",name:"Colorful Fish",message:"Your practice helped a little fish find its way to the reef."}:{id:"shell",emoji:"🐚",name:"Goa Seashell",message:"Every completed test uncovers a new little discovery."};state.discoveries=Array.isArray(state.discoveries)?state.discoveries:[];const newReward=!state.discoveries.includes(reward.id);if(newReward)state.discoveries.push(reward.id);state.autoMood="excited";state.moodUntil=Date.now()+30000;save();playSound("excited");document.getElementById("app").innerHTML=`<div class="quiz-shell"><div class="question-card" style="text-align:center"><div style="font-size:74px">${moods.excited.face}</div><div class="eyebrow" style="color:var(--teal)">${quizMode==="test"?"TEST COMPLETE":"STAGE COMPLETE"}</div><h2>${score>=quizQuestions.length*.75?"Brilliant work!":"Nice effort — keep practising!"}</h2><p>You answered <b>${score} of ${quizQuestions.length}</b> questions correctly.</p><div class="discovery-card"><div class="eyebrow" style="color:var(--teal)">OLLIE'S GOA DISCOVERY</div><div class="discovery-art">${reward.emoji} 🌊 🦉</div><h3>${newReward?"New discovery unlocked!":"Discovery collected again!"}</h3><h2 style="margin:4px 0">${reward.name}</h2><p>${reward.message}</p><p class="muted">“Every word you learn opens a new world.”</p><small>Collection: ${state.discoveries.length} / 3 ocean discoveries</small></div><div class="profile-grid"><div class="metric"><strong>+${score*12}</strong><span>XP earned this round</span></div><div class="metric"><strong>${accuracy}%</strong><span>Accuracy</span></div></div><p class="muted">Ollie says: “Every try helps you grow!”</p><button class="primary" style="width:100%;margin-top:10px" onclick="state.tab='learn';save();render()">Back to learning path</button><button class="secondary" style="width:100%;margin-top:9px" onclick="state.tab='friends';save();render()">🗺️ Visit Goa map & friends</button>${current+1<getCourse().stages.length&&isUnlocked(current+1)?`<button class="secondary" style="width:100%;margin-top:9px" onclick="startLesson(${current+1})">Continue to next stage →</button>`:""}</div></div>`}
function exitQuiz(){current=null;state.tab="learn";render()}function copyId(){if(!state.userId)state.userId="FL-"+Math.random().toString(36).slice(2,8).toUpperCase();save();const txt=state.userId+" | "+stageLabel();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>alert("Fluento ID copied!")).catch(()=>prompt("Copy your Fluento ID:",txt));else prompt("Copy your Fluento ID:",txt)}
function addFriend(){const el=document.getElementById("friendName"),name=el.value.trim();if(!name)return el.focus();if(state.friends.some(f=>f.name.toLowerCase()===name.toLowerCase()))return alert("That nickname is already in your demo circle.");state.friends.push({name,emoji:["🐸","🐨","🦊","🐼","🐯","🐧"][state.friends.length%6],xp:Math.floor(Math.random()*90)});save();render()}
function claimQuest(){if(state.questsClaimed.includes("explorer"))return;state.questsClaimed.push("explorer");state.xp+=20;save();render()}function saveName(){state.name=document.getElementById("playerName").value.trim()||"Learner";save();render()}
function resetProgress(){if(confirm("Reset your XP, stages and local progress? This cannot be undone.")){state={...initial,friends:[...initial.friends],done:{},earned:[],discoveries:[],questsClaimed:[],userId:"",welcomeSeen:true};save();render()}}
initializeVisit();updateStats();render();
</script>
