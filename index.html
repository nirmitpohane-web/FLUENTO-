.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 0 13px}.section-head h2{margin:0;font-size:1.35rem}.muted{color:var(--muted);font-size:.92rem}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow)}.course-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.course-row select,.mood-select{background:white;border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);font-weight:750}.progress-track{height:9px;background:#e5efec;border-radius:99px;overflow:hidden;margin-top:9px}.progress-fill{height:100%;background:var(--teal);border-radius:99px;transition:width .25s}.stage-list{display:grid;gap:13px}.stage{display:grid;grid-template-columns:56px 1fr auto;gap:13px;align-items:center;background:white;border:1px solid var(--line);border-radius:19px;padding:14px;box-shadow:var(--shadow)}.stage.locked{opacity:.68;background:#f0f5f3}.stage-icon{width:54px;height:54px;border-radius:17px;background:var(--teal2);display:grid;place-items:center;font-size:27px}.stage.locked .stage-icon{background:#e7ecea}.stage h3{margin:0 0 3px;font-size:1.04rem}.stage p{margin:0;color:var(--muted);font-size:.88rem}.stage-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.mini{font-size:.77rem;font-weight:800;background:#f1f7f5;padding:4px 7px;border-radius:7px}.primary,.secondary,.danger{padding:11px 15px;border-radius:12px;font-weight:900;transition:transform .1s}.primary{background:var(--teal);color:white}.primary:active,.secondary:active{transform:scale(.98)}.primary:disabled{background:#a6bcb7;cursor:not-allowed;opacity:.85}.secondary{background:var(--teal2);color:var(--teal)}.danger{background:#ffeaeb;color:#a62e36}.tabs{position:fixed;z-index:6;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px max(8px,env(safe-area-inset-bottom))}.tabs button{flex:1;max-width:170px;padding:9px 4px;border-radius:12px;background:transparent;color:var(--muted);font-size:.78rem;font-weight:850}.tabs button.active{background:var(--teal2);color:var(--teal)}.tabs span{display:block;font-size:1.2rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.friend{display:flex;align-items:center;gap:12px}.avatar{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:#fce8d2;font-size:25px}.friend-info{flex:1;min-width:0}.friend-info strong{display:block}.friend-info small{color:var(--muted)}.rank{font-weight:950;color:var(--teal)}.quiz-shell{max-width:700px;margin:0 auto}.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.quiz-progress{flex:1}.close-btn{background:#edf4f1;border-radius:50%;width:40px;height:40px;font-size:20px}.question-card{background:white;border:1px solid var(--line);border-radius:23px;padding:22px;box-shadow:var(--shadow)}.question-card h2{font-size:clamp(1.3rem,4vw,1.9rem);margin:8px 0 18px}.question-type{font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:var(--teal);font-weight:950}.options{display:grid;gap:10px}.option{border:2px solid var(--line);border-radius:14px;padding:13px;text-align:left;background:white;font-weight:750;color:var(--ink);width:100%;touch-action:manipulation}.option:disabled{opacity:1;cursor:default}.option.selected{border-color:var(--teal);background:var(--teal2)}.option.correct{border-color:#3a9c68;background:#e3f8e9}.option.wrong{border-color:var(--red);background:#ffebec}.feedback{padding:12px;border-radius:12px;margin-top:14px;font-weight:800}.feedback.good{background:#e3f8e9;color:#17633b}.feedback.bad{background:#ffebec;color:#a62e36}.quiz-actions{display:flex;justify-content:flex-end;margin-top:18px}.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.metric{padding:15px;border:1px solid var(--line);border-radius:16px;background:white}.metric strong{display:block;font-size:1.5rem}.metric span{font-size:.86rem;color:var(--muted)}.empty{text-align:center;padding:28px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:25px}.welcome{position:fixed;inset:0;z-index:20;min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px 18px;background:radial-gradient(circle at 80% 20%,#d7f36a88,transparent 28%),linear-gradient(135deg,#e7faf4,#f7fbff)}.welcome h1{font-size:clamp(42px,10vw,72px);letter-spacing:-2px;margin:8px 0;color:#147d78;font-weight:950}.welcome-inner{max-width:560px;width:100%}.welcome .owl{font-size:76px}.director{font-size:12px;font-weight:900;letter-spacing:.5px}.mood-panel{margin-top:16px}.mood-row{display:flex;align-items:center;gap:14px}.mood-face{font-size:55px;min-width:65px;text-align:center}.mood-select{display:block;width:100%;margin-top:8px}.sound-button{width:100%;margin-top:10px}.mood-face.pop{animation:pop .35s ease}@keyframes pop{50%{transform:scale(1.25) rotate(-5deg)}}
@media(max-width:560px){header{padding:10px 12px}.brand{font-size:1.1rem}.brandmark{width:34px;height:34px}.stats{gap:5px}.pill{padding:6px 7px;font-size:.78rem}.hero{padding:19px}.mascot{font-size:57px}.stage{grid-template-columns:46px 1fr;gap:10px}.stage-icon{width:46px;height:46px}.stage>button{grid-column:2;justify-self:start}.stage p{font-size:.83rem}.section-head{align-items:start;flex-direction:column}.question-card{padding:17px}}

<body>
<header><div class="brand"><div class="brandmark">F</div>Fluento</div><div class="stats"><div class="pill">🔥 <b id="streak">1</b></div><div class="pill">⚡ <b id="xp">0</b> XP</div><div class="pill">❤️ <b id="hearts">5</b></div></div></header>
<main id="app"></main>
<div id="welcomeScreen" class="welcome" style="display:none"><div class="welcome-inner"><div class="director">DIRECTOR: NIRMIT</div><div class="owl" id="welcomeFace">🦉</div><h1>FLUENTO</h1><h2>Learn a little. Grow every day.</h2><p id="welcomeMessage">Languages, levels, practice and rewards — one lesson at a time.</p><button class="primary" onclick="enterFluento()">Start learning →</button></div></div>
<nav class="tabs" aria-label="Main navigation"><button data-tab="learn" class="active"><span>🗺️</span>Learn</button><button data-tab="friends"><span>👥</span>Friends</button><button data-tab="quests"><span>🎯</span>Quests</button><button data-tab="profile"><span>🏆</span>Profile</button></nav>
<script>
const courses={
 Spanish:{flag:"🇪🇸",label:"Spanish",stages:[
 {title:"First Words",desc:"Greetings, yes/no, and polite phrases",icon:"👋",lessons:[{q:"How do you say Hello in Spanish?",opts:["Hola","Adiós","Gracias","Agua"],a:"Hola",tip:"Hola means hello."},{q:"What does Gracias mean?",opts:["Please","Thank you","Good night","Friend"],a:"Thank you",tip:"Gracias means thank you."},{q:"Choose the Spanish word for water.",opts:["Pan","Agua","Casa","Libro"],a:"Agua",tip:"Agua means water."},{q:"What does Por favor mean?",opts:["Please","Goodbye","Sorry","Welcome"],a:"Please",tip:"Por favor means please."},{q:"Complete: Buenos ____ (Good morning).",opts:["días","libros","amigos","agua"],a:"días",tip:"Buenos días means good morning."}]},
 {title:"People & Friends",desc:"Introduce yourself and meet people",icon:"🧑‍🤝‍🧑",lessons:[{q:"What does amigo mean?",opts:["Friend","School","Food","Book"],a:"Friend",tip:"Amigo means friend."},{q:"Me llamo Ana means…",opts:["I am hungry","My name is Ana","I am at home","See you tomorrow"],a:"My name is Ana",tip:"Me llamo… gives your name."},{q:"Choose How are you?",opts:["¿Cómo estás?","¿Dónde está?","Gracias","Buenas noches"],a:"¿Cómo estás?",tip:"¿Cómo estás? asks how someone is."},{q:"What is familia?",opts:["Family","City","Teacher","Water"],a:"Family",tip:"Familia means family."},{q:"What does Mucho gusto mean?",opts:["Nice to meet you","Good morning","I don't know","Goodbye"],a:"Nice to meet you",tip:"A phrase used when meeting someone."}]},
 {title:"Food & Café",desc:"Order snacks and drinks",icon:"🥑",lessons:[{q:"What does pan mean?",opts:["Bread","Milk","Apple","Rice"],a:"Bread",tip:"Pan means bread."},{q:"Choose I want water.",opts:["Quiero agua","Tengo casa","Hola amigo","Soy libro"],a:"Quiero agua",tip:"Quiero means I want."},{q:"What does manzana mean?",opts:["Apple","Orange","Bread","Cheese"],a:"Apple",tip:"Manzana means apple."},{q:"Which word means milk?",opts:["Leche","Agua","Pan","Sal"],a:"Leche",tip:"Leche means milk."},{q:"Choose Good night.",opts:["Buenas noches","Buenos días","Por favor","Hasta luego"],a:"Buenas noches",tip:"Buenas noches means good night."}]}
 ]},
 English:{flag:"🇬🇧",label:"English",stages:[
 {title:"Everyday Words",desc:"Greetings and useful basics",icon:"👋",lessons:[{q:"Choose a greeting.",opts:["Hello","Because","Under","Quickly"],a:"Hello",tip:"Hello is a greeting."},{q:"Opposite of cold?",opts:["Hot","Slow","Small","Quiet"],a:"Hot",tip:"Hot is the opposite of cold."},{q:"Complete: How ____ you?",opts:["are","is","am","be"],a:"are",tip:"The phrase is How are you?"},{q:"Choose the polite word.",opts:["Please","Never","Maybe","Under"],a:"Please",tip:"Please makes a request polite."},{q:"Plural of book?",opts:["Books","Bookes","Bookies","Book"],a:"Books",tip:"Add -s to most nouns."}]},
 {title:"Build Sentences",desc:"Practice grammar and word order",icon:"🧱",lessons:[{q:"Choose the correct sentence.",opts:["She is happy.","She happy is.","Is happy she.","Happy she are."],a:"She is happy.",tip:"Use subject + verb + adjective."},{q:"Complete: They ____ playing.",opts:["are","is","am","be"],a:"are",tip:"Use are with they."},{q:"Past tense of go?",opts:["Went","Goed","Gone yesterday","Going"],a:"Went",tip:"Go → went → gone."},{q:"Choose the article: ____ apple.",opts:["An","A","The a","No article ever"],a:"An",tip:"Use an before a vowel sound."},{q:"Synonym of quick?",opts:["Fast","Late","Weak","Soft"],a:"Fast",tip:"Quick and fast are synonyms."}]},
 {title:"Grammar Challenge",desc:"A little more practice",icon:"🚩",checkpoint:true,lessons:[{q:"Choose the correct form.",opts:["He doesn't like tea.","He don't likes tea.","He doesn't likes tea.","He not like tea."],a:"He doesn't like tea.",tip:"After doesn't, use the base verb."},{q:"Opposite of generous?",opts:["Selfish","Kind","Helpful","Giving"],a:"Selfish",tip:"Selfish is the opposite of generous."},{q:"Choose the correct question.",opts:["Where do you live?","Where you live?","Where does you live?","Where are live you?"],a:"Where do you live?",tip:"Use do with you in the present simple."},{q:"Past tense of teach?",opts:["Taught","Teached","Teaching","Teach"],a:"Taught",tip:"Teach → taught."},{q:"Choose correct punctuation.",opts:["Let's eat, Grandma!","Lets eat Grandma!","Let's eat Grandma","Lets eat, Grandma"],a:"Let's eat, Grandma!",tip:"Punctuation can change meaning."}]}
 ]},
 Hindi:{flag:"🇮🇳",label:"Hindi",stages:[{title:"शुरुआती शब्द",desc:"नमस्ते और रोज़ के शब्द",icon:"🙏",lessons:[{q:"नमस्ते का अर्थ क्या है?",opts:["अभिवादन","पानी","किताब","घर"],a:"अभिवादन",tip:"नमस्ते अभिवादन के लिए कहा जाता है।"},{q:"पानी का अर्थ?",opts:["Water","Book","Friend","School"],a:"Water",tip:"पानी = Water"},{q:"धन्यवाद का अर्थ?",opts:["Thank you","Goodbye","Please","Friend"],a:"Thank you",tip:"धन्यवाद = Thank you"},{q:"मित्र का अर्थ?",opts:["Friend","Food","House","Book"],a:"Friend",tip:"मित्र = Friend"},{q:"घर का अर्थ?",opts:["House","School","Water","Day"],a:"House",tip:"घर = House"}]}]}
};
const extraWords={French:{flag:"🇫🇷",pairs:[["Bonjour","Hello"],["Merci","Thank you"],["Au revoir","Goodbye"],["S’il vous plaît","Please"],["Oui","Yes"]]},German:{flag:"🇩🇪",pairs:[["Hallo","Hello"],["Danke","Thank you"],["Tschüss","Goodbye"],["Bitte","Please"],["Ja","Yes"]]},Italian:{flag:"🇮🇹",pairs:[["Ciao","Hello"],["Grazie","Thank you"],["Arrivederci","Goodbye"],["Per favore","Please"],["Sì","Yes"]]},Japanese:{flag:"🇯🇵",pairs:[["こんにちは","Hello"],["ありがとう","Thank you"],["さようなら","Goodbye"],["お願いします","Please"],["はい","Yes"]]}};
for(const [name,c] of Object.entries(extraWords)){courses[name]={flag:c.flag,label:name,stages:[{title:"Starter Words",desc:"Learn useful everyday words",icon:"🌱",lessons:c.pairs.map(([word,meaning])=>({q:`What does “${word}” mean?`,opts:[meaning,...c.pairs.map(x=>x[1]).filter(x=>x!==meaning).slice(0,3)],a:meaning,tip:`${word} means ${meaning}.`}))}]}}
const initial={course:"Spanish",xp:0,hearts:5,streak:1,done:{},earned:[],tab:"learn",name:"Learner",friends:[{name:"Aarav",emoji:"🦊",xp:120},{name:"Mira",emoji:"🐼",xp:95},{name:"Kabir",emoji:"🐯",xp:80}],questsClaimed:[],userId:"",welcomeSeen:false,lastVisitAt:0,lastDay:"",soundOn:true,moodOverride:"auto",autoMood:"happy",moodUntil:0};
let state;try{state={...initial,...JSON.parse(localStorage.getItem("fluento-save")||"{}")}}catch{state={...initial}}let current=null,qi=0,score=0,selected=null;
const moods={happy:{face:"😊",message:"You're doing great! Keep learning!"},sad:{face:"🥺",message:"That's okay! Every mistake helps you learn."},excited:{face:"🤩",message:"WOW! You're making amazing progress!"},angry:{face:"😠",message:"Grrr! Tricky question! Let's try again."}};
function save(){try{localStorage.setItem("fluento-save",JSON.stringify(state))}catch(e){}updateStats()}
function updateStats(){document.getElementById("xp").textContent=state.xp;document.getElementById("hearts").textContent=state.hearts;document.getElementById("streak").textContent=state.streak}
function getMood(){if(state.moodOverride&&state.moodOverride!=="auto")return state.moodOverride;if(state.moodUntil>Date.now()&&moods[state.autoMood])return state.autoMood;return "happy"}
function setMood(m){state.moodOverride=m;save();render();if(m!=="auto")playSound(m)}
let audioContext=null;function playSound(kind="welcome"){if(state.soundOn===false)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioContext ||= new AC();if(audioContext.state==="suspended")audioContext.resume();const notes=kind==="excited"?[523,659,784]:kind==="sad"?[392,330]:kind==="angry"?[220,180]:[523,659];notes.forEach((hz,i)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain(),t=audioContext.currentTime+i*.12;osc.type="sine";osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.10,t+.025);gain.gain.exponentialRampToValueAtTime(.0001,t+.19);osc.connect(gain);gain.connect(audioContext.destination);osc.start(t);osc.stop(t+.2)})}catch(e){}}
function toggleSound(){state.soundOn=state.soundOn===false;save();render();if(state.soundOn)playSound("welcome")}
function moodPanelHTML(){const mood=getMood(),info=moods[mood];return `<section class="panel mood-panel"><div class="mood-row"><div class="mood-face" id="moodFace">${info.face}</div><div><b>Ollie says...</b><div>${info.message}</div><span class="mini">${state.welcomeBack?"Welcome-back bonus reaction!":"Your learning companion"}</span></div></div><label for="moodSelect"><b>Test Ollie's mood</b></label><select class="mood-select" id="moodSelect" onchange="setMood(this.value)"><option value="auto" ${state.moodOverride==="auto"?"selected":""}>✨ Automatic</option>${Object.keys(moods).map(m=>`<option value="${m}" ${state.moodOverride===m?"selected":""}>${moods[m].face} ${m[0].toUpperCase()+m.slice(1)}</option>`).join("")}</select><button class="secondary sound-button" onclick="toggleSound()">${state.soundOn===false?"🔇 Sound off":"🔊 Sound on"}</button></section>`}
function initializeVisit(){const now=Date.now(),prev=Number(state.lastVisitAt||0),days=prev?Math.floor((now-prev)/86400000):0;state.welcomeBack=days>=3;if(state.welcomeBack){state.autoMood="excited";state.moodUntil=now+60000;document.getElementById("welcomeFace").textContent=moods.excited.face;document.getElementById("welcomeMessage").textContent="You're back after a break! Ollie is excited to learn with you again."}else{document.getElementById("welcomeFace").textContent=moods.happy.face;document.getElementById("welcomeMessage").textContent="Languages, levels, practice and rewards — one lesson at a time."}state.lastVisitAt=now;save()}
function enterFluento(){state.welcomeSeen=true;if(!state.userId)state.userId="FL-"+Math.random().toString(36).slice(2,8).toUpperCase();save();render();playSound(state.welcomeBack?"excited":"welcome")}
function getCourse(){return courses[state.course]||courses.Spanish}function doneKey(i){return state.course+"-"+i}function isDone(i){return !!state.done[doneKey(i)]}function isUnlocked(i){return i===0||isDone(i-1)}function currentStage(){return getCourse().stages.filter((s,i)=>isDone(i)).length}function stageLabel(){return "Stage "+Math.min(currentStage()+1,getCourse().stages.length)+" · "+getCourse().label}
function setTab(tab){state.tab=tab;save();render()}document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){updateStats();const welcome=document.getElementById("welcomeScreen");if(welcome)welcome.style.display=state.welcomeSeen?"none":"grid";const app=document.getElementById("app");if(state.tab==="learn")app.innerHTML=learnHTML();else if(state.tab==="friends")app.innerHTML=friendsHTML();else if(state.tab==="quests")app.innerHTML=questsHTML();else app.innerHTML=profileHTML();document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab))}
function learnHTML(){const c=getCourse(),finished=c.stages.filter((s,i)=>isDone(i)).length,pct=Math.round(finished/c.stages.length*100);return `<section class="hero"><div><div class="eyebrow">YOUR DAILY LANGUAGE QUEST</div><h1>Small steps.<br>Big fluency.</h1><p>Learn at your pace with stages, checkpoints, and Ollie cheering you on.</p></div><div class="mascot" aria-label="Ollie the owl">${moods[getMood()].face}</div></section>${moodPanelHTML()}<div class="section-head"><div><h2>Your learning path</h2><div class="muted">${c.flag} ${c.label} · ${finished}/${c.stages.length} stages completed</div></div></div><div class="panel"><div class="course-row"><label for="courseSelect"><b>Learning language</b></label><select id="courseSelect">${Object.keys(courses).map(k=>`<option ${k===state.course?"selected":""}>${k}</option>`).join("")}</select><span class="muted">Choose a course</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="muted" style="margin-top:7px">${pct}% path complete</div></div><div class="section-head"><h2>Stages</h2><span class="muted">Complete all questions in a stage to unlock the next</span></div><div class="stage-list">${c.stages.map((s,i)=>{const d=isDone(i),u=isUnlocked(i);return `<article class="stage ${u?"":"locked"}"><div class="stage-icon">${d?"✅":u?s.icon:"🔒"}</div><div><h3>${i+1}. ${s.title}</h3><p>${s.desc}</p><div class="stage-meta"><span class="mini">${s.lessons.length} questions</span><span class="mini">⭐ ${s.lessons.length*10} XP</span>${d?'<span class="mini">Completed</span>':""}</div></div><button class="${u?"primary":"secondary"}" ${u?"":"disabled"} onclick="startLesson(${i})">${d?"Practice":u?"Start":"Locked"}</button></article>`}).join("")}</div><footer>Fluento · Learn a little every day.</footer>`}
function friendsHTML(){const list=[{name:state.name||"You",emoji:"🦉",xp:state.xp,you:true},...state.friends].sort((a,b)=>b.xp-a.xp);return `<div class="section-head"><div><h2>Friends Circle 👥</h2><div class="muted">Celebrate progress together.</div></div></div><section class="hero"><div><div class="eyebrow">THIS WEEK</div><h1>Every XP counts!</h1><p>Demo friends are shown locally; online accounts are not connected.</p></div><div class="mascot">🦉</div></section><div class="panel" style="margin-top:15px"><h3>Your Fluento ID</h3><p><b>${state.userId||"Create your ID"}</b></p><button class="primary" onclick="copyId()">Share / copy my ID</button><p class="muted">Your progress is saved on this device.</p></div><div class="section-head"><h2>Demo leaderboard</h2></div><div class="panel">${list.map((f,i)=>`<div class="friend" style="padding:11px 0;border-bottom:1px solid var(--line)"><div class="avatar">${f.emoji}</div><div class="friend-info"><strong>${escapeText(f.name)} ${f.you?"(you)":""}</strong><small>${f.you?"Your learning journey":"Demo learner"}</small></div><div class="rank">#${i+1} · ${f.xp} XP</div></div>`).join("")}</div><div class="section-head"><h2>Add a demo friend</h2></div><div class="panel"><div class="course-row"><input id="friendName" placeholder="Friend's nickname" maxlength="20" style="flex:1;min-width:140px;border:1px solid var(--line);padding:11px;border-radius:12px"><button class="primary" onclick="addFriend()">＋ Add friend</button></div></div>`}
function questsHTML(){const completed=getCourse().stages.filter((s,i)=>isDone(i)).length,claimable=completed>=1&&!state.questsClaimed.includes("explorer");return `<div class="section-head"><div><h2>Daily quests 🎯</h2><div class="muted">Tiny goals build a lasting habit.</div></div></div><div class="cards"><div class="panel"><div style="font-size:28px">📚</div><h3>Lesson explorer</h3><p class="muted">Complete one stage.</p><p><b>${Math.min(completed,1)}/1 stage</b></p><button class="${claimable?"primary":"secondary"}" ${claimable?"":"disabled"} onclick="claimQuest()">Claim +20 XP</button></div><div class="panel"><div style="font-size:28px">🧠</div><h3>Curious mind</h3><p class="muted">Collect XP through practice.</p><p><b>${state.xp} XP collected</b></p><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,state.xp)}%"></div></div></div><div class="panel"><div style="font-size:28px">🔥</div><h3>Come back tomorrow</h3><p class="muted">Keep your streak going.</p><p><b>${state.streak} day streak</b></p></div></div>`}
function profileHTML(){const completed=Object.keys(state.done).filter(k=>state.done[k]).length;return `<div class="panel"><h2>🏆 Your profile</h2><div class="course-row"><div class="mascot" style="font-size:55px">${moods[getMood()].face}</div><div style="flex:1"><label for="playerName"><b>Your nickname</b></label><input id="playerName" value="${escapeAttr(state.name||"Learner")}" maxlength="24" style="display:block;width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:12px"><button class="secondary" style="margin-top:9px" onclick="saveName()">Save nickname</button></div></div></div><div class="section-head"><h2>Your stats</h2></div><div class="profile-grid"><div class="metric"><strong>⚡ ${state.xp}</strong><span>Total XP</span></div><div class="metric"><strong>🔥 ${state.streak}</strong><span>Day streak</span></div><div class="metric"><strong>✅ ${completed}</strong><span>Stages completed</span></div><div class="metric"><strong>🏅 ${state.earned.length}</strong><span>Badges earned</span></div></div><div class="section-head"><h2>Settings</h2></div><div class="panel"><p class="muted">Sounds, moods and progress are saved in this browser. Clearing browser data may erase progress.</p><button class="secondary" onclick="toggleSound()">${state.soundOn===false?"🔇 Turn sound on":"🔊 Turn sound off"}</button> <button class="danger" onclick="resetProgress()">Reset progress</button></div>`}
function escapeText(s){return String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function escapeAttr(s){return escapeText(s).replace(/'/g,"&#39;")}
document.addEventListener("change",e=>{if(e.target.id==="courseSelect"){state.course=e.target.value;save();render()}});
function startLesson(i){if(!isUnlocked(i))return;current=i;qi=0;score=0;selected=null;showQuestion()}
function showQuestion(){const app=document.getElementById("app"),s=getCourse().stages[current],q=s.lessons[qi];app.innerHTML=`<div class="quiz-shell"><div class="quiz-top"><button class="close-btn" onclick="exitQuiz()" aria-label="Exit lesson">×</button><div class="quiz-progress"><div class="progress-track"><div class="progress-fill" style="width:${qi/s.lessons.length*100}%"></div></div></div><b>❤️ ${state.hearts}</b></div><div class="question-card"><div class="question-type">Stage ${current+1} · Question ${qi+1}/${s.lessons.length}</div><h2>${q.q}</h2><div class="options">${q.opts.map(o=>`<button class="option" type="button" onclick="chooseAnswer(this)">${escapeText(o)}</button>`).join("")}</div><div id="feedback"></div><div class="quiz-actions"><button class="primary" id="checkBtn" onclick="checkAnswer()" disabled>Check answer</button></div></div><p class="muted" style="text-align:center;margin-top:16px">Ollie says: “You can do it. One question at a time!” 🦉</p></div>`}
function chooseAnswer(button){if(!button||button.disabled)return;selected=button.textContent.trim();document.querySelectorAll(".option").forEach(b=>b.classList.toggle("selected",b===button));const btn=document.getElementById("checkBtn");if(btn)btn.disabled=false}
function checkAnswer(){if(typeof selected!=="string"||!selected)return;const q=getCourse().stages[current].lessons[qi],chosen=selected,ok=chosen===q.a;state.autoMood=ok?"happy":"sad";state.moodUntil=Date.now()+15000;playSound(state.autoMood);const fb=document.getElementById("feedback");fb.className="feedback "+(ok?"good":"bad");fb.textContent=(ok?"Correct! +10 XP. ":"Not quite. ")+q.tip;document.querySelectorAll(".option").forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add("correct");else if(b.textContent===chosen)b.classList.add("wrong")});const btn=document.getElementById("checkBtn");btn.textContent=qi===getCourse().stages[current].lessons.length-1?"Finish stage":"Continue";btn.onclick=nextQuestion;selected=ok?"__correct__":"__incorrect__"}
function nextQuestion(){if(selected==="__correct__"){score++;state.xp+=10}else if(selected==="__incorrect__"){state.hearts=Math.max(0,state.hearts-1)}qi++;selected=null;save();if(qi<getCourse().stages[current].lessons.length)showQuestion();else finishLesson()}
function finishLesson(){const key=doneKey(current),wasDone=!!state.done[key],s=getCourse().stages[current];if(!wasDone){state.done[key]=true;state.xp+=Math.max(0,score*2);if(!state.earned.includes("first"))state.earned.push("first");if(s.checkpoint&&!state.earned.includes("checkpoint"))state.earned.push("checkpoint")}state.autoMood="excited";state.moodUntil=Date.now()+30000;save();playSound("excited");document.getElementById("app").innerHTML=`<div class="quiz-shell"><div class="question-card" style="text-align:center"><div style="font-size:74px">${moods.excited.face}</div><div class="eyebrow" style="color:var(--teal)">STAGE COMPLETE</div><h2>${score>=s.lessons.length*.75?"Brilliant work!":"Nice effort — keep practising!"}</h2><p>You answered <b>${score} of ${s.lessons.length}</b> questions correctly.</p><div class="profile-grid"><div class="metric"><strong>+${score*12}</strong><span>XP earned this round</span></div><div class="metric"><strong>${Math.round(score/s.lessons.length*100)}%</strong><span>Accuracy</span></div></div><p class="muted">Ollie says: “Every try helps you grow!”</p><button class="primary" style="width:100%;margin-top:10px" onclick="state.tab='learn';save();render()">Back to learning path</button>${current+1<getCourse().stages.length&&isUnlocked(current+1)?`<button class="secondary" style="width:100%;margin-top:9px" onclick="startLesson(${current+1})">Continue to next stage →</button>`:""}</div></div>`}
function exitQuiz(){current=null;state.tab="learn";render()}function copyId(){if(!state.userId)state.userId="FL-"+Math.random().toString(36).slice(2,8).toUpperCase();save();const txt=state.userId+" | "+stageLabel();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>alert("Fluento ID copied!")).catch(()=>prompt("Copy your Fluento ID:",txt));else prompt("Copy your Fluento ID:",txt)}
function addFriend(){const el=document.getElementById("friendName"),name=el.value.trim();if(!name)return el.focus();if(state.friends.some(f=>f.name.toLowerCase()===name.toLowerCase()))return alert("That nickname is already in your demo circle.");state.friends.push({name,emoji:["🐸","🐨","🦊","🐼","🐯","🐧"][state.friends.length%6],xp:Math.floor(Math.random()*90)});save();render()}
function claimQuest(){if(state.questsClaimed.includes("explorer"))return;state.questsClaimed.push("explorer");state.xp+=20;save();render()}function saveName(){state.name=document.getElementById("playerName").value.trim()||"Learner";save();render()}
function resetProgress(){if(confirm("Reset your XP, stages and local progress? This cannot be undone.")){state={...initial,friends:[...initial.friends],done:{},earned:[],questsClaimed:[],userId:"",welcomeSeen:true};save();render()}}
initializeVisit();updateStats();render();
</script>
</body>
</html>
