
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102c36">
<title>FLUENTO — Learn with Ollie</title>
<style>
:root{--bg:#f2faf7;--card:#fff;--ink:#17353c;--teal:#147d78;--soft:#dff5ee;--line:#dce9e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px Arial,sans-serif}
header{background:#103f45;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
main{max-width:760px;margin:auto;padding:16px 14px 85px}
h1,h2,h3{line-height:1.2}
button,select{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px}
button{background:var(--teal);color:white;font-weight:bold}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);padding:18px;margin:14px 0;border:1px solid var(--line);border-radius:20px;box-shadow:0 5px 18px #1233}
.hero{background:linear-gradient(135deg,#126c65,#163d50);color:white;padding:22px;border-radius:22px;display:flex;align-items:center;gap:15px}
.hero p{line-height:1.5}
.mascot{font-size:68px;animation:float 2s infinite ease-in-out}
@keyframes float{50%{transform:translateY(-7px)}}
.face{font-size:55px}
.muted{color:#637b80;font-size:.92rem}
select{background:var(--soft);color:var(--ink);width:100%;margin:7px 0}
.full{width:100%;margin-top:9px}
.secondary{background:var(--soft);color:var(--teal)}
.option{display:block;width:100%;text-align:left;margin:9px 0;background:white;color:var(--ink);border:2px solid var(--line)}
.option.selected{border-color:var(--teal);background:var(--soft)}
.option.correct{border-color:#31945b;background:#e3f8e9}
.option.wrong{border-color:#d94f57;background:#ffebec}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid var(--line);padding:7px;gap:5px}
nav button{flex:1;padding:10px 3px;font-size:12px}
.stats{display:flex;gap:8px;font-size:13px}
.progress{height:9px;background:#e4eeeb;border-radius:10px;overflow:hidden}
.progress div{height:100%;background:var(--teal)}
@media(max-width:430px){.hero{padding:16px}.mascot{font-size:52px}.stats{gap:4px}}
</style>
</head>
<body>
<header>
  <strong>🟢 FLUENTO</strong>
  <div class="stats">
    <span>⚡ <b id="xp">0</b> XP</span>
    <span>❤️ <b id="hearts">5</b></span>
  </div>
</header>

<main id="app"></main>

<nav>
  <button onclick="showHome()">🏠 Home</button>
  <button onclick="showLessons()">📚 Learn</button>
  <button onclick="showMood()">😊 Ollie</button>
  <button onclick="showProfile()">🏆 Profile</button>
</nav>

<script>
const KEY="fluento_v2_progress";

const initial={
 xp:0,hearts:5,done:[],lastVisit:0,
 sound:true,override:"auto",autoMood:"happy",
 moodUntil:0,lessonsToday:0
};

let state;
try{
  state={...initial,...JSON.parse(localStorage.getItem(KEY)||"{}")};
}catch(e){
  state={...initial};
}

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}
  catch(e){console.log("Progress could not be saved")}
}

const moods={
 happy:{face:"😊",message:"You're doing great! Keep learning!"},
 sad:{face:"🥺",message:"Mistakes help us learn. Try again!"},
 excited:{face:"🤩",message:"WOW! You're making amazing progress!"},
 angry:{face:"😠",message:"Grrr! That was tricky. Let's beat this challenge!"}
};

const questions=[
 {q:"How do you say Hello in Spanish?",o:["Hola","Gracias","Agua","Adiós"],a:0,tip:"Hola means Hello."},
 {q:"What does Gracias mean?",o:["Please","Thank you","Water","Goodbye"],a:1,tip:"Gracias means Thank you."},
 {q:"Which Spanish word means water?",o:["Casa","Libro","Agua","Amigo"],a:2,tip:"Agua means Water."},
 {q:"What does Amigo mean?",o:["Friend","School","Food","Book"],a:0,tip:"Amigo means Friend."},
 {q:"How do you say Please in Spanish?",o:["Adiós","Por favor","Agua","Hola"],a:1,tip:"Por favor means Please."},
 {q:"What does Buenos días mean?",o:["Good morning","Good night","Thank you","Goodbye"],a:0,tip:"Buenos días means Good morning."},
 {q:"What does Familia mean?",o:["Family","Water","Friend","School"],a:0,tip:"Familia means Family."},
 {q:"Which means Goodbye?",o:["Hola","Gracias","Adiós","Sí"],a:2,tip:"Adiós means Goodbye."}
];

let questionIndex=0;
let selected=-1;
let answered=false;
let audio=null;

function getMood(){
 if(state.override!=="auto")return state.override;
 if(Date.now()<state.moodUntil)return state.autoMood;
 return "happy";
}

function setMood(mood){
 state.override=mood;
 save();
 showMood();
}

function react(mood,duration=15000){
 state.autoMood=mood;
 state.moodUntil=Date.now()+duration;
 save();
}

function playSound(kind="welcome"){
 if(!state.sound)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audio=audio||new AC();
  if(audio.state==="suspended")audio.resume();

  const notes=kind==="excited"?[523,659,784]:
    kind==="sad"?[392,330]:
    kind==="angry"?[220,180]:[523,659];

  notes.forEach((hz,i)=>{
   const osc=audio.createOscillator();
   const gain=audio.createGain();
   const start=audio.currentTime+i*.13;
   osc.type="sine";
   osc.frequency.value=hz;
   gain.gain.setValueAtTime(.001,start);
   gain.gain.exponentialRampToValueAtTime(.10,start+.03);
   gain.gain.exponentialRampToValueAtTime(.001,start+.19);
   osc.connect(gain);
   gain.connect(audio.destination);
   osc.start(start);
   osc.stop(start+.2);
  });
 }catch(e){console.log("Sound unavailable")}
}

function toggleSound(){
 state.sound=!state.sound;
 save();
 showMood();
 if(state.sound)playSound("welcome");
}

function moodHTML(){
 const m=getMood();
 return `
 <section class="card">
  <div style="display:flex;align-items:center;gap:16px">
   <div class="face" id="ollieFace">${moods[m].face}</div>
   <div><h3>Ollie says...</h3><p>${moods[m].message}</p></div>
  </div>
  <label for="moodChoice"><b>Test Ollie's mood</b></label>
  <select id="moodChoice" onchange="setMood(this.value)">
   <option value="auto" ${state.override==="auto"?"selected":""}>✨ Automatic</option>
   <option value="happy" ${state.override==="happy"?"selected":""}>😊 Happy</option>
   <option value="sad" ${state.override==="sad"?"selected":""}>🥺 Sad</option>
   <option value="excited" ${state.override==="excited"?"selected":""}>🤩 Excited</option>
   <option value="angry" ${state.override==="angry"?"selected":""}>😠 Angry</option>
  </select>
  <button class="secondary full" onclick="toggleSound()">
   ${state.sound?"🔊 Sound ON":"🔇 Sound OFF"}
  </button>
 </section>`;
}

function updateStats(){
 document.getElementById("xp").textContent=state.xp;
 document.getElementById("hearts").textContent=state.hearts;
}

function showHome(){
 updateStats();
 const days=state.lastVisit?
  Math.floor((Date.now()-state.lastVisit)/86400000):0;

 let welcome=days>=3?
  "You're back! Let's learn something amazing together!":
  "Welcome! A little practice every day makes you stronger.";

 document.getElementById("app").innerHTML=`
 <section class="hero">
  <div style="flex:1">
   <small>YOUR LEARNING COMPANION</small>
   <h1>Welcome to FLUENTO!</h1>
   <p>${welcome}</p>
   <button onclick="showLessons()">Start learning →</button>
  </div>
  <div class="mascot">${moods[getMood()].face}</div>
 </section>
 ${moodHTML()}
 <section class="card">
  <h2>📚 Your learning journey</h2>
  <p>Questions completed: ${state.done.length} / ${questions.length}</p>
  <div class="progress"><div style="width:${state.done.length/questions.length*100}%"></div></div>
  <button class="full" onclick="showLessons()">Continue learning</button>
 </section>
 <p class="muted" style="text-align:center">FLUENTO · Learn a little. Grow every day.</p>`;
 updateStats();
}

function showMood(){
 document.getElementById("app").innerHTML=`
 <section class="hero">
  <div><h1>Meet Ollie!</h1><p>Your learning buddy reacts to your progress.</p></div>
  <div class="mascot">${moods[getMood()].face}</div>
 </section>
 ${moodHTML()}`;
 updateStats();
}

function showLessons(){
 updateStats();
 document.getElementById("app").innerHTML=`
 <h1>📚 Mini lessons</h1>
 <p class="muted">Learn Spanish words. Choose an answer and check it.</p>
 <section class="card">
  <div class="progress"><div style="width:${state.done.length/questions.length*100}%"></div></div>
  ${questions.map((q,i)=>`
   <div style="padding:13px 0;border-bottom:1px solid var(--line)">
    <b>${i+1}. ${q.q}</b>
    <span>${state.done.includes(i)?" ✅ Completed":""}</span>
    <button class="secondary full" onclick="startQuestion(${i})">
     ${state.done.includes(i)?"Practice again":"Start question"}
    </button>
   </div>`).join("")}
 </section>`;
}

function startQuestion(i){
 questionIndex=i;
 selected=-1;
 answered=false;
 const q=questions[i];
 document.getElementById("app").innerHTML=`
 <section class="card">
  <p class="muted">Question ${i+1} of ${questions.length}</p>
  <div class="progress"><div style="width:${(i+1)/questions.length*100}%"></div></div>
  <h2>${q.q}</h2>
  <div id="options">
   ${q.o.map((x,j)=>`
    <button class="option" onclick="choose(${j})">${x}</button>
   `).join("")}
  </div>
  <p id="feedback"></p>
  <button id="check" class="full" onclick="checkAnswer()" disabled>Check answer</button>
  <button class="secondary full" onclick="showLessons()">Back to lessons</button>
 </section>`;
}

function choose(i){
 if(answered)return;
 selected=i;
 document.querySelectorAll(".option").forEach((b,j)=>{
  b.classList.toggle("selected",j===i);
 });
 document.getElementById("check").disabled=false;
}

function checkAnswer(){
 if(selected<0||answered)return;
 answered=true;
 const q=questions[questionIndex];
 const correct=selected===q.a;
 const opts=document.querySelectorAll(".option");

 opts.forEach((b,i)=>{
  b.disabled=true;
  if(i===q.a)b.classList.add("correct");
  else if(i===selected)b.classList.add("wrong");
 });

 const fb=document.getElementById("feedback");
 if(correct){
  fb.textContent="Correct! +10 XP. "+q.tip;
  state.xp+=10;
  if(!state.done.includes(questionIndex)){
   state.done.push(questionIndex);
  }
  react("happy");
  playSound("welcome");
 }else{
  fb.textContent="Not quite. "+q.tip;
  state.hearts=Math.max(0,state.hearts-1);
  react("sad");
  playSound("sad");
 }
 save();
 updateStats();
 document.getElementById("check").textContent="Continue";
 document.getElementById("check").onclick=()=>{
  if(state.done.length===questions.length){
   react("excited",30000);
   playSound("excited");
  }
  showLessons();
 };
}

function showProfile(){
 document.getElementById("app").innerHTML=`
 <section class="card">
  <h1>🏆 Your profile</h1>
  <h2>⚡ ${state.xp} XP</h2>
  <p>Questions completed: ${state.done.length}/${questions.length}</p>
  <p>❤️ Hearts remaining: ${state.hearts}</p>
  <button class="secondary full" onclick="showMood()">Change Ollie's mood</button>
  <button class="secondary full" onclick="toggleSound()">Toggle sound</button>
  <button class="full" onclick="showHome()">Home</button>
 </section>`;
}

function enterFluento(){
 document.getElementById("welcomeScreen")?.remove();
 showHome();
}

function initialize(){
 const now=Date.now();
 const previous=state.lastVisit||0;
 const days=previous?Math.floor((now-previous)/86400000):0;

 if(days>=3){
  react("excited",60000);
  state.welcomeBack=true;
 }else{
  state.welcomeBack=false;
 }
 state.lastVisit=now;
 save();
 showHome();
}

initialize();
</script>
</body>
</html>
